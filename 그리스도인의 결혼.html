<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>그리스도인의 결혼 — 아홉 가지 물음, 하나의 은혜</title>
<meta name="description" content="결혼을 두고 누구나 품는 아홉 가지 물음에, 성경은 사람의 조건이 아닌 은혜로 답합니다.">
<meta property="og:type" content="website">
<meta property="og:title" content="그리스도인의 결혼 — 아홉 가지 물음, 하나의 은혜">
<meta property="og:description" content="결혼을 두고 누구나 품는 아홉 가지 물음에, 성경은 사람의 조건이 아닌 은혜로 답합니다.">
<meta property="og:image" content="https://kidori777.github.io/Bible/%EA%B7%B8%EB%A6%AC%EC%8A%A4%EB%8F%84%EC%9D%B8%EC%9D%98%20%EA%B2%B0%ED%98%BC.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#101418;--sub:#2e353c;--halo:#ecf1f6}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);line-height:1.7;font-style:normal;
background:linear-gradient(180deg,#e8eff5 0,#ecf1f6 14%,#f4eff3 40%,#fbf0e6 72%,#fff4d8 100%) no-repeat;min-height:100vh}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
.hero{padding:72px 0 28px}
h1{font-family:'Noto Serif KR',serif;font-weight:800;font-size:clamp(38px,10.5vw,60px);line-height:1.2;letter-spacing:-.02em}
.lead{margin-top:18px;font-size:clamp(15px,3.9vw,17px);color:var(--sub);max-width:30em;word-break:keep-all}
#braid{display:block;width:100%;height:auto;margin:34px 0 10px;overflow:visible}
#braid .s{fill:none;stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
#braid .h{fill:none;stroke:var(--halo);stroke-width:17;stroke-linecap:butt}
.key{display:flex;align-items:center;gap:12px;font-size:13px;font-weight:500;color:var(--sub)}
.key i{flex:0 0 120px;height:6px;background:linear-gradient(90deg,#5e7f9e,#c9707a 60%,#e6b23a)}
ol{list-style:none;padding:8px 0 80px}
li{position:relative}
li a{display:flex;gap:6px;min-height:136px;color:inherit;text-decoration:none;align-items:stretch}
.gut{flex:0 0 72px;width:72px;align-self:stretch;height:auto}
.gut path{fill:none;stroke-width:6;stroke-linecap:round;vector-effect:non-scaling-stroke}
.node{position:absolute;left:21px;top:50%;width:30px;height:30px;margin-top:-15px;background:#fff;border:3px solid var(--c);transform:rotate(45deg);transition:transform .25s;display:flex;align-items:center;justify-content:center}
.node b{transform:rotate(-45deg);font-size:13px;font-weight:700;line-height:1;color:var(--ink)}
.txt{display:block;position:relative;flex:1;align-self:center;margin:14px 0;padding:16px 92px 16px 18px;background:rgba(255,255,255,.66);border:1px solid rgba(16,20,24,.16);border-radius:6px;word-break:keep-all;transition:background .2s,border-color .2s}
.go{position:absolute;right:14px;top:50%;margin-top:-15px;height:30px;display:flex;align-items:center;gap:6px;padding:0 12px;border:1.5px solid var(--ink);border-radius:15px;font-size:13px;font-weight:700;line-height:1;transition:background .2s,color .2s}
.go s{width:7px;height:7px;border-top:2px solid currentColor;border-right:2px solid currentColor;transform:rotate(45deg);margin-left:-2px}
li a:hover .txt,li a:focus-visible .txt{background:#fff;border-color:var(--c)}
li a:hover .go,li a:focus-visible .go{background:var(--ink);color:#fff}
@media (max-width:480px){.txt{padding-right:58px}.go{font-size:0;width:30px;padding:0;justify-content:center;gap:0}.go s{margin-left:-3px}}
.q{display:block;font-family:'Noto Serif KR',serif;font-weight:800;font-size:clamp(18px,4.8vw,24px);line-height:1.45}
.t{display:block;margin-top:8px;font-weight:500;font-size:15px}
.r{display:block;margin-top:2px;font-size:13px;color:var(--sub)}
li a:hover .q,li a:focus-visible .q{text-decoration:underline;text-decoration-color:var(--c);text-decoration-thickness:3px;text-underline-offset:5px}
li a:hover .node,li a:focus-visible .node{transform:rotate(45deg) scale(1.12)}
a:focus-visible{outline:3px solid var(--c,#5e7f9e);outline-offset:2px}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.2s ease forwards}
.late{opacity:0;animation:fi .6s ease 2s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
@keyframes fi{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.late{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="wrap">
<header class="hero">
<h1>그리스도인의 결혼</h1>
<p class="lead">결혼을 두고 누구나 품는 아홉 가지 물음에, 성경은 사람의 조건이 아닌 은혜로 답합니다.</p>
<svg id="braid" viewBox="0 0 900 150" role="img" aria-label="두 가닥이 아홉 번 만나 하나로 엮이는 그림"></svg>
<div class="key"><span>물음</span><i></i><span>은혜</span></div>
</header>
<main><ol id="list"></ol></main>
</div>
<script>
var BASE="https://kidori777.github.io/Bible/";
var D=[
["누구를 배우자로 선택해야 합니까?","누구를 배우자로 선택할 것인가","외모와 조건을 넘어 하나님의 경륜 안에서"],
["결혼은 왜 만들어졌습니까?","아담과 하와 — 결혼의 창조 목적","창세기 2:18–24"],
["배우자를 정할 때 하나님의 뜻을 구할 수 있습니까?","이삭과 리브가 — 언약 안에서의 배우자 선택","창세기 24장"],
["사랑하면 결혼의 모든 것이 해결됩니까?","야곱과 라헬과 레아 — 외모와 사랑, 그리고 결혼의 현실","창세기 29–30장"],
["잘못된 결혼은 신앙에 어떤 영향을 줍니까?","솔로몬 — 잘못된 결혼이 신앙에 미치는 영향","열왕기상 11:1–8"],
["배우자가 우상숭배로 이끌면 어떻게 됩니까?","아합과 이세벨 — 결혼을 통해 우상숭배에 빠질 때","열왕기상 16–21장"],
["배신당해도 끝까지 사랑할 수 있습니까?","호세아와 고멜 — 배신한 아내를 사랑하는 남편","호세아 1–3장"],
["기업을 무르는 사람은 누구입니까?","보아스와 룻 — 기업을 무르는 사람과 신부를 얻는 그리스도","룻기 1–4장"],
["결혼은 결국 무엇을 가리킵니까?","그리스도와 교회 — 결혼의 최종적인 의미","에베소서 5:22–33, 요한계시록 19:7–9, 21:2"]
];
var SL=[94,127,158],RO=[201,112,122],GO=[230,178,58];
function mix(a,b,t){return"rgb("+a.map(function(v,i){return Math.round(v+(b[i]-v)*t)}).join(",")+")"}
function ca(t){return mix(SL,GO,t)}function cb(t){return mix(RO,GO,t)}
/* 목록 */
var L=document.getElementById("list"),h="";
D.forEach(function(d,i){
 var n=i+1,t0=i/9,t1=n/9,file="그리스도인의 결혼"+n+".html";
 var c=mix(SL,GO,(t0+t1)/2),id="g"+n;
 h+='<li style="--c:'+c+'"><a href="'+BASE+encodeURIComponent(file)+'">'
 +'<svg class="gut" viewBox="0 0 72 100" preserveAspectRatio="none" style="'+(i%2?'transform:scaleX(-1)':'')+'">'
 +'<defs><linearGradient id="'+id+'a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+ca(t0)+'"/><stop offset="1" stop-color="'+ca(t1)+'"/></linearGradient>'
 +'<linearGradient id="'+id+'b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+cb(t0)+'"/><stop offset="1" stop-color="'+cb(t1)+'"/></linearGradient></defs>'
 +'<path d="M18 0C18 55 54 45 54 100" stroke="url(#'+id+'a)"/><path d="M54 0C54 55 18 45 18 100" stroke="url(#'+id+'b)"/></svg>'
 +'<i class="node"><b>'+n+'</b></i><span class="txt"><span class="q">'+d[0]+'</span><span class="t">'+d[1]+'</span><span class="r">'+d[2]+'</span><span class="go">읽기<s></s></span></span></a></li>';
});
L.innerHTML=h;
/* 히어로 땋은 줄 */
(function(){
 var W=900,cy=75,A=46,m=30,s=(W-2*m)/9,x0=m+s/2,S=document.getElementById("braid"),NS="http://www.w3.org/2000/svg";
 function Y(x,k){return cy+k*A*Math.sin(Math.PI*(x-x0)/s)}
 function pts(k,a,b){var p=[],i,N=Math.max(8,Math.round((b-a)/4));for(i=0;i<=N;i++){var x=a+(b-a)*i/N;p.push((i?"L":"M")+x.toFixed(1)+" "+Y(x,k).toFixed(1))}return p.join("")}
 var out='<defs><linearGradient id="ha" gradientUnits="userSpaceOnUse" x1="'+m+'" x2="'+(W-m)+'"><stop offset="0" stop-color="rgb(94,127,158)"/><stop offset="1" stop-color="rgb(230,178,58)"/></linearGradient>'
 +'<linearGradient id="hb" gradientUnits="userSpaceOnUse" x1="'+m+'" x2="'+(W-m)+'"><stop offset="0" stop-color="rgb(201,112,122)"/><stop offset="1" stop-color="rgb(230,178,58)"/></linearGradient></defs>';
 out+='<path class="s draw" pathLength="1" stroke="url(#ha)" d="'+pts(-1,m,W-m)+'"/><path class="s draw" pathLength="1" stroke="url(#hb)" d="'+pts(1,m,W-m)+'"/>';
 for(var j=0;j<9;j++){
  var x=x0+j*s,k=j%2?1:-1,g=k<0?"ha":"hb",d=pts(k,x-s*.3,x+s*.3);
  out+='<g class="late"><path class="h" d="'+d+'"/><path class="s" stroke="url(#'+g+')" d="'+d+'"/>'
  +'<rect x="'+(x-6)+'" y="'+(cy-6)+'" width="12" height="12" transform="rotate(45 '+x+' '+cy+')" fill="'+mix(SL,GO,(j+.5)/9)+'" stroke="#fff" stroke-width="2"/></g>';
 }
 S.innerHTML=out;
})();
</script>
</body>
</html>
